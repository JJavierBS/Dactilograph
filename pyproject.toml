[project]
name = "dactilograph"
version = "0.1.0"
description = "Real-time recognition of the Spanish Sign Language (LSE) fingerspelling alphabet"
authors = [
    { name = "Jose Javier", email = "josejavierbravosarabia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
