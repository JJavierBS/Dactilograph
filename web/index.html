<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dactilograph</title>
    <meta
      name="description"
      content="Aprende el alfabeto dactilológico de la Lengua de Signos Española con tu webcam."
    />
  </head>
  <body>
    <main>
      <header>
        <h1>Dactilograph</h1>
        <p>El alfabeto dactilológico de la LSE, con tu mano. La cámara no sale de tu ordenador.</p>
      </header>
      <section class="stage">
        <div class="camera">
          <canvas id="view" width="640" height="480"></canvas>
          <p id="fps" class="fps" hidden></p>
        </div>
        <aside class="verdict">
          <p class="label">veo</p>
          <p id="letter" class="letter">–</p>
          <p id="confidence" class="confidence">seguridad</p>
          <p class="label history-label">lo último que has hecho</p>
          <ol id="history" class="history"></ol>
        </aside>
      </section>
      <p id="status" class="status">Cargando los modelos…</p>
      <button id="start" type="button">Activar la cámara</button>
      <video id="video" playsinline muted></video>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
